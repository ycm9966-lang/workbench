<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的个人工作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--acc:#ff5c8a;--acc2:#ffb0c4;--ink:#3d3a4e;--sub:#9b93a8}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#ffeef5 0%,#fff8ec 50%,#eaf7ff 100%);background-attachment:fixed;color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh}
body[data-page=daily]{--acc:#ff5c8a;--acc2:#ffb0c4}
body[data-page=tasks]{--acc:#ff8a3d;--acc2:#ffc08a}
body[data-page=projects]{--acc:#4f8df7;--acc2:#a9c8ff}
body[data-page=know]{--acc:#9b5cf6;--acc2:#cdaaff}
body[data-page=fin]{--acc:#18b566;--acc2:#8fe3b8}
body[data-page=review]{--acc:#00b8a9;--acc2:#8ce3dc}
body[data-page=settings]{--acc:#8a90a0;--acc2:#c6cbd6}
.app{display:flex;min-height:100vh}
.sidebar{width:190px;flex-shrink:0;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border-right:1px solid #ffe1ec;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar .brand{font-size:16px;font-weight:800;padding:6px 10px 16px;border-bottom:1px dashed #ffd6e5;margin-bottom:10px;background:linear-gradient(90deg,#ff5c8a,#ff8a3d,#4f8df7,#9b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-btn{display:block;width:100%;text-align:left;padding:10px 12px;background:none;border:none;color:#7d7490;font-size:14px;cursor:pointer;border-radius:12px;margin-bottom:2px}
.nav-btn:hover{background:#fff0f6}
.nav-btn.active{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.1)}
main{flex:1;padding:22px;min-width:0}
.wrap{max-width:1060px;margin:0 auto}
h2.page-title{font-size:20px;margin-bottom:14px;font-weight:800}
h3{font-size:16px;margin-bottom:12px}
.card{background:rgba(255,255,255,.94);border-radius:18px;padding:16px 18px;box-shadow:0 4px 16px rgba(255,92,138,.08);margin-bottom:14px;border:1px solid #fff}
.card h4{font-size:14px;margin-bottom:10px;color:#6d6480}
.grid{display:grid;gap:12px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.stat{border-radius:18px;padding:14px 16px;box-shadow:0 4px 12px rgba(255,92,138,.06);border:1px solid #fff}
.grid .stat:nth-child(4n+1){background:linear-gradient(135deg,#fff0f5,#ffe1ee)}
.grid .stat:nth-child(4n+2){background:linear-gradient(135deg,#fff7e6,#ffedcf)}
.grid .stat:nth-child(4n+3){background:linear-gradient(135deg,#eef5ff,#dfeaff)}
.grid .stat:nth-child(4n+4){background:linear-gradient(135deg,#f4ecff,#e8dbff)}
.stat .num{font-size:24px;font-weight:800;color:var(--acc)}
.stat .lbl{font-size:12px;color:var(--sub);margin-top:2px}
.stat .sub{font-size:12px;color:var(--sub)}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc2);box-shadow:none}
.btn.small{padding:5px 12px;font-size:12px}
.btn.danger{background:linear-gradient(135deg,#f4436c,#ff8ba0)}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;white-space:nowrap;font-weight:600}
.b-gray{background:#f0eff4;color:#7d7490}
.b-blue{background:#e3edff;color:#3b6fe0}
.b-green{background:#def5e7;color:#189a52}
.b-orange{background:#ffeeda;color:#c76b10}
.b-red{background:#ffe3e8;color:#e0335b}
.b-purple{background:#f0e6ff;color:#8347d6}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--sub);font-weight:600;padding:8px 10px;border-bottom:2px solid #ffe4ef;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px dashed #f6e6ee;vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover{background:#fff5f9}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:7px 15px;border-radius:999px;background:#fff;border:1.5px solid #f3dbe6;cursor:pointer;font-size:13px;color:#6d6480;font-weight:600}
.pill.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.empty{color:#b3aec0;padding:18px;text-align:center;background:#fdf8fb;border-radius:14px;font-size:13px}
.mask{position:fixed;inset:0;background:rgba(80,50,80,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:22px;max-width:680px;width:100%;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-bottom:14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:#8a7f9a;margin-bottom:4px;font-weight:600}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f input[type=url],.f select,.f textarea{width:100%;border:1.5px solid #f0dce6;border-radius:12px;padding:8px 11px;font-size:14px;font-family:inherit;background:#fffdfe;color:var(--ink)}
.f textarea{resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags .ck{background:#fdf0f5;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:#6d6480}
.tags .ck input{margin-right:3px}
.hint{font-size:12px;color:#9a7f92;background:#fff3f8;border:1px dashed #ffd6e5;border-radius:12px;padding:8px 12px;margin:6px 0 12px}
.goal{color:#7d7490;font-size:12.5px;margin:6px 0}
.pc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pc-top b{font-size:14.5px}
.meta{font-size:12px;color:var(--sub);margin-top:8px}
.prog{display:flex;align-items:center;gap:10px;margin:8px 0}
.prog .bar{flex:1;height:8px;background:#fdeef4;border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.prog span{font-size:12px;color:#7d7490;white-space:nowrap}
.kcard{border-bottom:1px dashed #f6e6ee;padding:12px 6px;cursor:pointer;border-radius:12px}
.kcard:hover{background:#fff5f9}
.kcard .t{font-weight:700}
.kcard .c{color:#5d5570;margin:4px 0;white-space:pre-wrap}
.kcard .m{font-size:12px;color:var(--sub)}
.star{color:#ffb400;font-weight:800}
.home-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.home-head .date{color:#9a8aa0;font-size:13px;margin-top:3px}
.sec-title{font-size:15px;font-weight:800;margin:20px 0 10px;color:#5d5470}
.sec-title::before{content:'✨ '}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #f6e6ee;font-size:13px;align-items:center}
.list-item:last-child{border-bottom:none}
.taskline{padding:8px 12px;border:1px solid #ffe4ef;border-radius:14px;margin-bottom:7px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fffafd}
.overdue{color:#e0335b;font-size:13px;margin-top:6px}
a{color:#3b6fe0}
.note-box{font-size:12.5px;color:#8a7150;background:#fff8e8;border:1px solid #ffe6ad;border-radius:14px;padding:10px 14px;margin-bottom:14px}
@media (max-width:860px){
.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.frow{grid-template-columns:1fr}.frow3{grid-template-columns:1fr}
.app{display:block}
.sidebar{width:100%;height:auto;position:sticky;top:0;z-index:20;display:flex;overflow-x:auto;padding:8px;gap:4px;border-bottom:1px solid #ffe1ec;-webkit-overflow-scrolling:touch}
.sidebar .brand{display:none}
.nav-btn{white-space:nowrap;flex-shrink:0;padding:8px 13px;border-radius:999px}
main{padding:14px 12px 26px}
.mask{padding:14px 8px;align-items:center}
.modal{padding:18px 14px;max-height:88vh;overflow:auto}
.stat .num{font-size:22px}
}

</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">🌈 我的工作台</div>
  <button class="nav-btn active" data-page="home" onclick="go('home')">🏠 首页</button>
  <button class="nav-btn" data-page="daily" onclick="go('daily')">📔 每日记录</button>
  <button class="nav-btn" data-page="tasks" onclick="go('tasks')">🔥 任务</button>
  <button class="nav-btn" data-page="projects" onclick="go('projects')">🚀 项目</button>
  <button class="nav-btn" data-page="know" onclick="go('know')">💡 知识灵感库</button>
  <button class="nav-btn" data-page="fin" onclick="go('fin')">💰 财务</button>
  <button class="nav-btn" data-page="review" onclick="go('review')">📊 复盘</button>
  <button class="nav-btn" data-page="settings" onclick="go('settings')">⚙️ 设置</button>
</aside>
<main id="main"></main>
</div>
<div id="mask" class="mask" hidden onclick="closeModal()"></div>
<script>
/* ================= 基础工具 ================= */
var LS = 'pw_data_v1';
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtD(d){var p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function today(){return fmtD(new Date())}
function addDays(s,n){var a=s.split('-').map(Number);return fmtD(new Date(a[0],a[1]-1,a[2]+n))}
function weekRange(){var n=new Date();var wd=(n.getDay()+6)%7;var mon=addDays(fmtD(n),-wd);return [mon,addDays(mon,6)]}
function monthRange(){var n=new Date();return [fmtD(new Date(n.getFullYear(),n.getMonth(),1)),fmtD(new Date(n.getFullYear(),n.getMonth()+1,0))]}
function sel(id,opts,val){var arr=Array.isArray(opts)?opts:opts.split(',');return '<select id="'+id+'">'+arr.map(function(o){var sv=(o==='')?'selected':'';var so=String(o)===String(val)?'selected':'';return '<option value="'+esc(o)+'" '+so+'>'+(o===''?'（未填写）':esc(o))+'</option>'}).join('')+'</select>'}
function badge(cls,txt){return '<span class="badge b-'+cls+'">'+esc(txt)+'</span>'}
function stColor(s){return {'待办':'gray','进行中':'blue','已完成':'green','已取消':'gray','未开始':'gray','休息日':'purple','规划中':'blue','暂停':'orange'}[s]||'gray'}
function priColor(p){return {'P1':'red','P2':'orange','P3':'gray'}[p]||'gray'}

/* ================= 常量 ================= */
var TASK_DOMAINS=['教学','教研','运动','学习','生活','财务','个人成长'];
var PROJ_DOMAINS=['教学','教研','职业发展','健康','学习','财务','个人成长'];
var EX_TYPES=['休息','游泳','骑行','力量训练','拉伸','散步','其他'];
var MOODS=['','开心','平静','疲惫','焦虑','低落','其他'];
var WORK_STATUS=['未开始','进行中','已完成','休息日'];
var TASK_STATUS=['待办','进行中','已完成','已取消'];
var PRI=['P1','P2','P3'];
var FIN_TYPES=['收入','支出','还款','储蓄转入','储蓄转出'];
var FIN_CATS=['工资','餐饮','交通','购物','生活','还贷','储蓄','其他'];
var ACCOUNTS=['工资卡','支付宝','微信','现金','其他'];
var K_TYPES=['学习笔记','句子摘抄','阅读记录','生活感悟'];
var K_TAGS=['化学','教育','成长','生活','关系','自由','财务','健康'];
var PROJ_STATUS=['规划中','进行中','暂停','已完成'];

/* ================= 数据层 ================= */
var db=null;
function seed(){
  function P(name,domain,goal,nextStep){return {id:uid(),name:name,domain:domain,goal:goal,status:'进行中',startDate:'',dueDate:'',keyResults:'',files:'',review:'',nextStep:nextStep||''}}
  return {
    dailyLogs:[],tasks:[],knowledge:[],finance:[],reviews:[],
    projects:[
      P('高中化学教学与备课积累','教学','持续积累教学设计、课件、实验方案与备课素材，形成个人教学资源库。','整理本周备课资源'),
      P('高中化学原创试题及命题研究','教研','开展原创试题命制与命题规律研究，形成可展示、可发表的命题成果。','确定一个命题主题'),
      P('教研论文与成果申报','教研','完成教研论文写作、投稿与教学成果申报材料准备。','列出论文提纲'),
      P('职称评审材料归档','职业发展','按评审要求分类归档教学、教研、荣誉等各类证明材料。','建立归档目录'),
      P('健康管理与运动习惯','健康','建立可持续的运动与作息习惯，配合减脂目标稳步推进。','安排本周运动'),
      P('专业学习与个人能力提升','学习','坚持专业阅读与化学前沿学习，积累个人知识库。','确定本月阅读书目'),
      P('个人财务规划与储蓄目标','财务','合理规划收支，按计划偿还贷款并达成储蓄目标。','记录本月预算')
    ]
  };
}
function load(){
  try{var d=JSON.parse(localStorage.getItem(LS));if(d&&d.projects&&d.dailyLogs){return d}}catch(e){}
  return seed();
}
function save(){localStorage.setItem(LS,JSON.stringify(db))}
db=load();

/* 关联计算：任务按计划日期/完成日期自动出现在对应每日记录中，无需重复录入 */
function tasksOn(date){return db.tasks.filter(function(x){return x.planDate===date||(x.status==='已完成'&&x.doneDate===date)})}
function projTasks(pid){return db.tasks.filter(function(x){return x.projectId===pid&&x.status!=='已取消'})}
function projName(pid){var p=db.projects.find(function(x){return x.id===pid});return p?p.name:''}
function projOpts(val){var h='<select id="t_proj"><option value="">（无关联项目）</option>'+db.projects.map(function(p){return '<option value="'+p.id+'"'+(p.id===val?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select>';return h}

/* ================= 路由 ================= */
var page='home';
var taskTab='today',knowTab='all',finTab='month';
function go(p){page=p;render()}
function render(){
  document.body.dataset.page=page;
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b.dataset.page===page)});
  var m={home:vHome,daily:vDaily,tasks:vTasks,projects:vProjects,know:vKnow,fin:vFin,review:vReview,settings:vSettings};
  $('#main').innerHTML='<div class="wrap">'+m[page]()+'</div>';
}

/* ================= 弹窗 ================= */
function openModal(html){$('#mask').innerHTML='<div class="modal" onclick="event.stopPropagation()">'+html+'</div>';$('#mask').hidden=false}
function closeModal(){$('#mask').hidden=true;$('#mask').innerHTML=''}

/* ================= 首页 ================= */
function vHome(){
  var t=today(),wr=weekRange(),mr=monthRange();
  var isAct=function(x){return x.status==='待办'||x.status==='进行中'};
  var todayLog=db.dailyLogs.find(function(l){return l.date===t});
  var todayTasks=db.tasks.filter(function(x){return x.planDate===t&&x.status!=='已取消'&&x.status!=='已完成'});
  var todayDone=db.tasks.filter(function(x){return x.status==='已完成'&&x.doneDate===t});
  var weekLogs=db.dailyLogs.filter(function(l){return l.date>=wr[0]&&l.date<=t});
  var exLogs=weekLogs.filter(function(l){return l.exerciseMin>0&&l.exerciseType!=='休息'});
  var exMin=exLogs.reduce(function(a,b){return a+b.exerciseMin},0);
  var learnMin=weekLogs.reduce(function(a,b){return a+(b.learnMin||0)},0);
  var sqLogs=weekLogs.filter(function(l){return l.sleepQuality>0});
  var overdue=db.tasks.filter(function(x){return isAct(x)&&x.dueDate&&x.dueDate<t});
  var p1Today=todayTasks.filter(function(x){return x.priority==='P1'});
  var running=db.projects.filter(function(p){return p.status==='进行中'}).slice().sort(function(a,b){return (a.dueDate||'9999-12-31')<(b.dueDate||'9999-12-31')?-1:1});
  var star=db.knowledge.filter(function(k){return k.starred}).sort(function(a,b){return (b.recordDate||'').localeCompare(a.recordDate||'')})[0];
  var jyDone=db.tasks.filter(function(x){return x.domain==='教研'&&x.status==='已完成'&&x.doneDate}).sort(function(a,b){return b.doneDate.localeCompare(a.doneDate)})[0];
  var weekReview=db.reviews.find(function(r){return r.period==='每周'&&r.startDate===wr[0]});
  var monthReview=db.reviews.find(function(r){return r.period==='每月'&&r.startDate===mr[0]});
  var weekTodo=db.tasks.filter(function(x){return isAct(x)&&x.planDate>=wr[0]&&x.planDate<=wr[1]});
  var soonProj=db.projects.filter(function(p){return (p.status==='进行中'||p.status==='规划中')&&p.dueDate&&p.dueDate>=t&&p.dueDate<=addDays(t,14)}).sort(function(a,b){return a.dueDate<b.dueDate?-1:1});

  var taskLine=function(x){return '<div class="taskline"><span>'+badge(priColor(x.priority),x.priority)+' '+esc(x.name)+'</span><span>'+badge(stColor(x.status),x.status)+(x.dueDate?'<span style="font-size:12px;color:#8a90a0">截止 '+x.dueDate+'</span>':'')+'</span></div>'};

  var h='';
  /* 第一部分：顶部 */
  h+='<div class="home-head"><div><h2 class="page-title">🌸 我的工作台</h2><div class="date">今天也要元气满满呀～　'+t+'（星期'+'日一二三四五六'.charAt(new Date().getDay())+'）</div></div>'
   +'<div class="btns" style="margin:0">'
   +'<button class="btn" onclick="openDaily()">📔 '+(todayLog?'打开今日记录':'新建今日记录')+'</button>'
   +'<button class="btn ghost" onclick="openTask()">🔥 新增任务</button>'
   +'<button class="btn ghost" onclick="openQuick()">💬 记录一句话</button>'
   +'<button class="btn ghost" onclick="openFin()">💰 记一笔收支</button></div></div>';

  /* 第二部分：今日概览 */
  h+='<div class="sec-title">今日概览</div><div class="grid g4">'
   +'<div class="stat"><div class="num">'+todayTasks.length+'</div><div class="lbl">今日待办任务</div></div>'
   +'<div class="stat"><div class="num">'+todayDone.length+'</div><div class="lbl">今日已完成任务</div></div>'
   +'<div class="stat"><div class="num">'+exLogs.length+'<span style="font-size:14px"> 次</span></div><div class="lbl">本周运动</div><div class="sub">共 '+exMin+' 分钟</div></div>'
   +'<div class="stat"><div class="num">'+learnMin+'<span style="font-size:14px"> 分钟</span></div><div class="lbl">本周学习时长</div></div>'
   +'<div class="stat"><div class="num" style="font-size:18px;padding-top:4px">'+(todayLog?'<span style="color:#1e8e4a">已创建</span>':'<span style="color:#b56a00">未创建</span>')+'</div><div class="lbl">今日记录 '+(todayLog?'':'<button class="btn small" onclick="openDaily()">去创建</button>')+'</div></div>'
   +'</div>';

  /* 第三部分：今日行动 */
  h+='<div class="sec-title">今日行动</div><div class="grid g2">';
  h+='<div class="card"><h4>今日 P1 任务</h4>'+(p1Today.length?p1Today.map(taskLine).join(''):'<div class="empty">今日无 P1 任务</div>')+'</div>';
  h+='<div class="card"><h4>今日待办</h4>'+(todayTasks.length?todayTasks.map(taskLine).join(''):'<div class="empty">今日暂无待办任务</div>')

   +'<div class="stat"><div class="num">¥ '+(sin-sout).toFixed(2)+'</div><div class="lbl">本月净储蓄（转入 '+sin.toFixed(2)+' / 转出 '+sout.toFixed(2)+'）</div></div>'

/* ================= 复盘 ================= */
function vReview(){
  var h='<h2 class="page-title">📊 每周与每月复盘</h2>';
  h+='<div class="btns" style="margin-bottom:14px"><button class="btn" onclick="genReview(\'每周\')">生成本周复盘草稿</button><button class="btn ghost" onclick="genReview(\'每月\')">生成本月复盘草稿</button></div>';
  h+='<div class="hint">草稿由系统汇总对应周期的真实记录自动生成，未记录的内容会明确标注，不会编造。点击复盘可继续编辑，AI 建议一栏可把内容粘贴到 WorkBuddy 对话中由 AI 生成。</div>';
  var arr=db.reviews.slice().sort(function(a,b){return (b.startDate||'').localeCompare(a.startDate||'')});
  h+='<div class="card">';
  if(!arr.length)h+='<div class="empty">暂无复盘记录</div>';
  arr.forEach(function(r){
    var logs=db.dailyLogs.filter(function(l){return l.date>=(r.startDate||'')&&l.date<=(r.endDate||'')});
    h+='<div class="kcard" onclick="openReview(\''+r.id+'\')"><div class="t">'+esc(r.name)+' '+badge(r.period==='每周'?'blue':'purple',r.period)+'</div><div class="m">'+r.startDate+' ~ '+r.endDate+'　·　关联 '+logs.length+' 条每日记录</div></div>';
  });
  h+='</div>';
  return h;
}
function genReview(period){
  var s,e,label;
  if(period==='每周'){var wr=weekRange();s=wr[0];e=wr[1];label='周复盘（'+s+' ~ '+e+'）'}
  else{var mr=monthRange();s=mr[0];e=mr[1];label='月度总结（'+s.slice(0,7)+'）'}
  var exist=db.reviews.find(function(r){return r.period===period&&r.startDate===s});
  if(exist){openReview(exist.id);return}
  var inR=function(d){return d&&d>=s&&d<=e};
  var logs=db.dailyLogs.filter(function(l){return inR(l.date)}).sort(function(a,b){return a.date.localeCompare(b.date)});
  var doneT=db.tasks.filter(function(x){return x.status==='已完成'&&inR(x.doneDate)});
  var planT=db.tasks.filter(function(x){return x.planDate&&inR(x.planDate)&&x.status!=='已取消'});
  var overdue=db.tasks.filter(function(x){return (x.status==='待办'||x.status==='进行中')&&x.dueDate&&x.dueDate<e});
  var exL=logs.filter(function(l){return l.exerciseMin>0&&l.exerciseType!=='休息'});
  var lnL=logs.filter(function(l){return l.learnMin>0});
  var sqL=logs.filter(function(l){return l.sleepQuality>0});
  var fin=db.finance.filter(function(f){return inR(f.date)});
  var fsum=function(t){return fin.filter(function(f){return f.type===t}).reduce(function(a,b){return a+(+b.amount||0)},0)};
  var exTypes={};exL.forEach(function(l){exTypes[l.exerciseType]=(exTypes[l.exerciseType]||0)+1});
  var act=db.projects.filter(function(p){return p.status==='进行中'});
  var work=(doneT.length?('已完成任务 '+doneT.length+' 项：\n'+doneT.map(function(x){return '· '+x.name+(x.output?'（产出：'+x.output+'）':'')}).join('\n')):'（本周期未记录已完成任务）')
   +'\n\n本周期计划任务共 '+planT.length+' 项，其中已完成 '+planT.filter(function(x){return x.status==='已完成'}).length+' 项'+(overdue.length?'；截至周期结束时仍有 '+overdue.length+' 项未完成（可能原因需结合实际情况填写）':'')
   +'\n\n项目进展：\n'+(act.length?act.map(function(p){var ts=projTasks(p.id),d=ts.filter(function(x){return x.status==='已完成'}).length;return '· '+p.name+'：'+(ts.length?d+'/'+ts.length+'（'+Math.round(d/ts.length*100)+'%）':'暂无关联任务')}).join('\n'):'（暂无进行中项目）');
  var exTotal=exL.reduce(function(a,b){return a+b.exerciseMin},0);
  var exTypeStr=Object.keys(exTypes).map(function(k){return k+'×'+exTypes[k]}).join('、');
  var sqAvg=sqL.length?(sqL.reduce(function(a,b){return a+b.sleepQuality},0)/sqL.length).toFixed(1):null;
  var health='运动 '+exL.length+' 次，共 '+exTotal+' 分钟'+(exTypeStr?'（'+exTypeStr+'）':'')
   +'；\n睡眠质量平均 '+(sqAvg!==null?sqAvg+' 分（基于 '+sqL.length+' 条记录）':'（未记录）')
   +(logs.length?'；\n本周期有 '+logs.length+' 天有每日记录。':'；\n（本周期无每日记录）');
  var learn=lnL.length?('学习 '+lnL.length+' 次，共 '+lnL.reduce(function(a,b){return a+b.learnMin},0)+' 分钟；\n主题：'+lnL.map(function(l){return l.learnTopic||'（未填主题）'}).join('、')):'（本周期未记录学习）';
  var life=logs.some(function(l){return l.insight})?logs.filter(function(l){return l.insight}).map(function(l){return l.date+'：'+l.insight}).join('\n'):'（本周期未记录感悟）';
  var finTxt='收入 '+fsum('收入').toFixed(2)+' 元；普通支出 '+fsum('支出').toFixed(2)+' 元（不含还款与储蓄转账）；还款 '+fsum('还款').toFixed(2)+' 元；储蓄转入 '+fsum('储蓄转入').toFixed(2)+' 元、转出 '+fsum('储蓄转出').toFixed(2)+' 元（净储蓄 '+(fsum('储蓄转入')-fsum('储蓄转出')).toFixed(2)+' 元）。'+(fin.length?'':'（本周期未记录收支）');
  var rec={id:uid(),name:label,period:period,startDate:s,endDate:e,work:work,health:health,learn:learn,life:life,fin:finTxt,
   next:'（待填写：下阶段最值得优先推进的三件事）',
   ai:'（待生成：可将本复盘内容复制到 WorkBuddy 对话中，由 AI 分析本周重要成果、延期原因、值得保留的习惯与下周三件优先事项）'};
  db.reviews.push(rec);save();openReview(rec.id);
}
function openReview(id){
  var r=db.reviews.find(function(x){return x.id===id});
  if(!r)return;
  var logs=db.dailyLogs.filter(function(l){return l.date>=(r.startDate||'')&&l.date<=(r.endDate||'')});
  openModal('<h3>复盘 · '+esc(r.name)+'</h3>'
   +'<div class="hint">已按开始/结束日期自动关联该周期的 '+logs.length+' 条每日记录。</div>'
   +'<div class="frow3"><div class="f"><label>复盘周期</label>'+sel('r_period',['每周','每月'],r.period)+'</div>'
   +'<div class="f"><label>开始日期</label><input type="date" id="r_s" value="'+r.startDate+'"></div>'
   +'<div class="f"><label>结束日期</label><input type="date" id="r_e" value="'+r.endDate+'"></div></div>'
   +'<div class="f"><label>复盘名称</label><input type="text" id="r_name" value="'+esc(r.name)+'"></div>'
   +'<div class="f"><label>工作成果</label><textarea id="r_work" rows="4">'+esc(r.work)+'</textarea></div>'
   +'<div class="f"><label>健康与运动总结</label><textarea id="r_health" rows="3">'+esc(r.health)+'</textarea></div>'
   +'<div class="f"><label>学习总结</label><textarea id="r_learn" rows="3">'+esc(r.learn)+'</textarea></div>'
   +'<div class="f"><label>生活感悟</label><textarea id="r_life" rows="3">'+esc(r.life)+'</textarea></div>'
   +'<div class="f"><label>财务总结</label><textarea id="r_fin" rows="3">'+esc(r.fin)+'</textarea></div>'
   +'<div class="f"><label>下阶段重点</label><textarea id="r_next" rows="3">'+esc(r.next)+'</textarea></div>'
   +'<div class="f"><label>AI 复盘建议</label><textarea id="r_ai" rows="3">'+esc(r.ai)+'</textarea></div>'
   +'<div class="btns"><button class="btn" onclick="saveReview(\''+r.id+'\')">保存</button>'
   +'<button class="btn danger" onclick="delRec(\'reviews\',\''+r.id+'\')">删除</button>'
   +'<button class="btn ghost" onclick="closeModal()">取消</button></div>');
}
function saveReview(id){
  var g=function(i){return $('#'+i).value};
  var r=db.reviews.find(function(x){return x.id===id});
  r.name=g('r_name');r.period=g('r_period');r.startDate=g('r_s');r.endDate=g('r_e');
  r.work=g('r_work');r.health=g('r_health');r.learn=g('r_learn');r.life=g('r_life');r.fin=g('r_fin');r.next=g('r_next');r.ai=g('r_ai');
  save();closeModal();render();
}

/* ================= 通用删除 ================= */
function delRec(col,id){
  if(!confirm('确定删除这条记录？此操作不可撤销。'))return;
  db[col]=db[col].filter(function(x){return x.id!==id});
  save();closeModal();render();
}

/* ================= 设置 ================= */
function vSettings(){
  return '<h2 class="page-title">⚙️ 设置与数据</h2>'
   +'<div class="note-box">所有数据保存在当前浏览器的本地存储（localStorage）中，不会上传。请定期导出备份，避免更换浏览器或清理缓存导致数据丢失。</div>'
   +'<div class="card"><h4>数据统计</h4><div class="list-item"><span>每日记录</span><span>'+db.dailyLogs.length+' 条</span></div>'
   +'<div class="list-item"><span>任务</span><span>'+db.tasks.length+' 条</span></div>'
   +'<div class="list-item"><span>项目</span><span>'+db.projects.length+' 个</span></div>'
   +'<div class="list-item"><span>知识与灵感</span><span>'+db.knowledge.length+' 条</span></div>'
   +'<div class="list-item"><span>财务流水</span><span>'+db.finance.length+' 笔</span></div>'
   +'<div class="list-item"><span>复盘</span><span>'+db.reviews.length+' 份</span></div></div>'
   +'<div class="card"><h4>备份与恢复</h4><div class="btns">'
   +'<button class="btn" onclick="exportData()">导出数据备份（JSON）</button>'
   +'<label class="btn ghost" style="display:inline-block">导入恢复<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>'
   +'<button class="btn danger" onclick="clearAll()">清空全部数据</button></div></div>'
   +'<div class="card"><h4>自动化说明</h4><div style="font-size:13px;color:#5c6270">'
   +'· 每日记录：点击首页"新建今日记录"即可，系统自动防重复（每天仅一条）。<br>'
   +'· 任务完成：状态改为"已完成"时自动填写完成日期，并自动汇总到项目进度与每日记录，无需手动同步。<br>'
   +'· 每周/每月复盘：在"复盘"页一键生成草稿，数据全部来自真实记录。<br>'
   +'· 到期提醒：本页面无法发送系统通知，请通过首页"已逾期任务"提醒区与任务页"逾期任务 / 未来 7 天"视图查看。</div></div>';
}
function exportData(){
  var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='个人工作台数据备份_'+today()+'.json';a.click();
}
function importData(inp){
  var f=inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||!d.projects||!d.dailyLogs)throw 0;
      if(!confirm('导入将覆盖当前全部数据，确定继续？'))return;
      db=d;save();render();alert('导入成功');
    }catch(e){alert('文件格式不正确，导入失败')}
  };
  rd.readAsText(f);
}
function clearAll(){
  if(!confirm('确定清空全部数据？此操作不可撤销！'))return;
  if(!confirm('再次确认：真的要清空全部数据吗？建议先导出备份。'))return;
  localStorage.removeItem(LS);db=seed();save();render();
}

render();
</script>
</body>
</html>
